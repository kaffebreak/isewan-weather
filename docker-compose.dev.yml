version: '3.8'

services:
  isewan-weather-dev:
    build:
      context: .
    container_name: isewan-weather-dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - VITE_API_URL=http://localhost:8000
      - TZ=${TZ:-Asia/Tokyo}
    restart: unless-stopped
    command: ["python", "-u", "app.py"]
    networks:
      - edge

  nginx-dev:
    image: nginx:alpine
    container_name: isewan-weather-nginx-dev
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.dev.conf:/etc/nginx/conf.d/default.conf
      - ./docker/html/menu.html:/usr/share/nginx/html/menu.html:ro
    depends_on:
      - isewan-weather-dev
    restart: unless-stopped
    networks:
      - edge

# nagoya-control・irago-schedule と同じ external ネットワークに参加させ、
# 開発環境でも /nagoya-control, /irago-control のプロキシを動作させる。
networks:
  edge:
    external: true
    name: isewan-edge
