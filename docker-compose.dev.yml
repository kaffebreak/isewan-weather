version: '3.8'

services:
  isewan-weather-dev:
    build: 
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: isewan-weather-dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env
    environment:
      - PYTHONUNBUFFERED=1
      - VITE_API_URL=http://localhost:8000
      - TZ=Asia/Tokyo
      - FLASK_ENV=development
      - FLASK_DEBUG=1
    restart: unless-stopped
    command: ["python", "-u", "app.py"]

  nginx-dev:
    image: nginx:alpine
    container_name: isewan-weather-nginx-dev
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.dev.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - isewan-weather-dev
    restart: unless-stopped
