version: '3.8'

services:
  isewan-weather:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-http://10.10.10.11:8000}
    container_name: isewan-weather
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env
    environment:
      - PYTHONUNBUFFERED=1
      - VITE_API_URL=${VITE_API_URL:-http://10.10.10.11:8000}
      - TZ=Asia/Tokyo
      - FLASK_ENV=production
    user: "0:0"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/weather/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  nginx:
    image: nginx:alpine
    container_name: isewan-weather-nginx
    ports:
      - "${NGINX_HOST:-10.10.10.11}:${NGINX_PORT:-80}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - isewan-weather
    restart: unless-stopped
    environment:
      - TZ=Asia/Tokyo
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'
        reservations:
          memory: 64M
          cpus: '0.1'
