version: '3.8'

services:
  isewan-weather:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-http://10.10.10.11:8000}
    container_name: isewan-weather
    ports:
      - "${NGINX_HOST:-10.10.10.11}:8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - VITE_API_URL=${VITE_API_URL:-http://10.10.10.11:8000}
      - TZ=${TZ:-Asia/Tokyo}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/weather/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    networks:
      - edge

  nginx:
    image: nginx:alpine
    container_name: isewan-weather-nginx
    ports:
      - "${NGINX_HOST:-10.10.10.11}:${NGINX_PORT:-80}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./docker/html/menu.html:/usr/share/nginx/html/menu.html:ro
    depends_on:
      - isewan-weather
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Tokyo}
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'
        reservations:
          memory: 64M
          cpus: '0.1'
    networks:
      - edge

# nginx から /nagoya-control, /irago-control をプロキシするための共有ネットワーク。
# nagoya-control・irago-schedule 側の docker-compose.yml でも同じ external
# ネットワークに参加させる必要がある（初回のみ `docker network create isewan-edge`）。
networks:
  edge:
    external: true
    name: isewan-edge
