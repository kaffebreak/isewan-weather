<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>伊良湖水道 運航情報</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        color: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans",
          "Yu Gothic", sans-serif;
      }
      main {
        width: 100%;
        max-width: 32rem;
        padding: 2rem 1.5rem;
      }
      h1 {
        margin: 0 0 1.75rem;
        font-size: 1.375rem;
        font-weight: 700;
        text-align: center;
        letter-spacing: 0.02em;
      }
      .links {
        display: grid;
        gap: 1rem;
      }
      a.card {
        display: block;
        padding: 1.25rem 1.5rem;
        border-radius: 1rem;
        border: 1px solid #e2e8f0;
        background: #ffffff;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
        text-decoration: none;
        color: inherit;
        transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
      }
      a.card:hover {
        border-color: #93c5fd;
        box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
        transform: translateY(-1px);
      }
      .card .label {
        font-size: 1.0625rem;
        font-weight: 600;
      }
      .card .desc {
        margin-top: 0.25rem;
        font-size: 0.8125rem;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>伊良湖水道 運航情報</h1>
      <div class="links">
        <a class="card" href="/weather/">
          <div class="label">気象データ</div>
          <div class="desc">伊勢湾気象データ管理システム</div>
        </a>
        <a class="card" href="/nagoya-control/">
          <div class="label">名古屋港 船舶管制</div>
          <div class="desc">nagoya-control</div>
        </a>
        <a class="card" href="/irago-control/">
          <div class="label">伊良湖水道 船舶管制</div>
          <div class="desc">irago-control</div>
        </a>
      </div>
    </main>
  </body>
</html>
