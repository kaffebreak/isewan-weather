server {
    listen 80;
    server_name 10.10.10.11; # 環境に合わせて変更してください

    # セキュリティヘッダー
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ルート: 気象データ(/weather)と船舶管制(別ポート)へのリンクを並べた
    # 簡単なメニューページ
    location = / {
        root /usr/share/nginx/html;
        index menu.html;
    }

    # 末尾スラッシュなしでアクセスされた場合は正規化する
    location = /weather {
        return 301 /weather/;
    }

    # 気象データ（静的ファイル）
    location /weather/ {
        # Pythonバックエンドの /static/ へ転送する
        proxy_pass http://isewan-weather:8000/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # バックエンドAPI
    location /api/ {
        proxy_pass http://isewan-weather:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # APIタイムアウト設定
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ヘルスチェック用エンドポイント
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}