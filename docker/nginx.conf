server {
    listen 80;
    server_name 10.10.10.11; # 環境に合わせて変更してください

    # セキュリティヘッダー
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ルート: 気象データ(/weather)と船舶管制2システムへのリンクを並べた
    # 簡単なメニューページ
    location / {
        root /usr/share/nginx/html;
        index menu.html;
    }

    # 末尾スラッシュなしでアクセスされた場合は正規化する
    location = /weather {
        return 301 /weather/;
    }

    # 気象データ（静的ファイル）
    location /weather/ {
        # Pythonバックエンドの /static/ へ転送する
        proxy_pass http://isewan-weather:8000/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 名古屋港 船舶管制（別リポジトリ: kaffebreak/nagoya-control）
    # アプリ自体が APP_MOUNT_PATH=/nagoya-control を認識して相対パスを解決するため、
    # proxy_pass にパスを付けず、受け取ったURIをそのまま転送する。
    location = /nagoya-control {
        return 301 /nagoya-control/;
    }

    location /nagoya-control/ {
        proxy_pass http://nagoya-control:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 伊良湖水道 船舶管制（別リポジトリ: kaffebreak/irago-schedule、公開パスは /irago-control）
    # アプリ自体が /irago-control マウントを認識するため、同様にパスを付けず転送する。
    # 内部ポートは他システムと合わせて8000に統一（80/443はこのnginxの専用領域）。
    location = /irago-control {
        return 301 /irago-control/;
    }

    location /irago-control/ {
        proxy_pass http://irago-control:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # バックエンドAPI
    location /api/ {
        proxy_pass http://isewan-weather:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # APIタイムアウト設定
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ヘルスチェック用エンドポイント
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}